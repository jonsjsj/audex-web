services:
  audex-web:
    build: .
    image: ${AUDEX_WEB_IMAGE:-audex-web:latest}
    container_name: audex-web
    restart: unless-stopped
    ports:
      - "${AUDEX_WEB_PORT:-8420}:8000"
    volumes:
      - ${AUDEX_WEB_DATA_PATH:-./data}:/data
      # Lets Settings → "Update now" pull the latest ghcr.io image and
      # recreate this container itself (see backend/app/api/admin.py) — a
      # container-recreating capability is root-equivalent host access, so
      # only mount this if you're comfortable with that (fine for a
      # single-user homelab box; skip it otherwise — the button just 400s
      # cleanly without this bind).
      - ${AUDEX_WEB_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      - ABS_URL=${ABS_URL:-}
      - CODEX_URL=${CODEX_URL:-}
      - CODEX_WEBHOOK_TOKEN=${CODEX_WEBHOOK_TOKEN:-}
      - SECRET_KEY=${SECRET_KEY:?set a long random SECRET_KEY in .env}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_INTERNAL_BASE=${OIDC_INTERNAL_BASE:-}
      - DATABASE_URL=sqlite+aiosqlite:////data/audexweb.db
      - UPDATE_IMAGE=${UPDATE_IMAGE:-ghcr.io/jonsjsj/audex-web:latest}
      - UPDATE_CONTAINER_NAME=${UPDATE_CONTAINER_NAME:-audex-web}
      # Settings → "Report a problem" + automatic crash capture, filed as
      # GitHub issues (see backend/app/api/report.py) — blank disables it.
      - REPORT_GITHUB_TOKEN=${REPORT_GITHUB_TOKEN:-}
      - REPORT_GITHUB_REPO=${REPORT_GITHUB_REPO:-jonsjsj/audex-web}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
